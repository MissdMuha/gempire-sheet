<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gempire - Мастер-Пульт</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #2b2b2b;
            color: #fbf6ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { border-bottom: 2px solid #635a55; padding-bottom: 10px; font-family: 'Georgia', serif; text-align: center; }

        /* Стили формы */
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; text-transform: uppercase; font-weight: bold; color: #dcd3cb; letter-spacing: 1px;}
        input, select, textarea {
            background: #2b2b2b;
            border: 1px solid #635a55;
            color: #fbf6ec;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Segoe UI', sans-serif;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #dcd3cb; }
        textarea { resize: vertical; min-height: 120px; }

        .btn-submit {
            background-color: #635a55;
            color: #fbf6ec;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #7a706a; }

        /* Стили карточки (предпросмотр) */
        .card {
            background-color: #fbf6ec; width: 63.5mm; height: 88.9mm;
            border: 1px solid rgba(69, 63, 60, 0.1); border-radius: 8px;
            display: flex; padding: 2.2mm; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            color: #2c2825; flex-shrink: 0;
        }
        .card-frame { flex-grow: 1; border: 2px solid #453f3c; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; position: relative;}
        .card-header { background-color: #635a55; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #453f3c; height: 48px; flex-shrink: 0;}
        .card-title-box { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; justify-content: center;}
        .card-label-display { font-size: 9px; text-transform: uppercase; font-weight: bold; color: #dcd3cb; letter-spacing: 0.5px;}
        .card-title-display { font-family: 'Constantia', 'Georgia', serif; font-size: 15px; font-weight: bold; color: #fbf6ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-tag-box { width: 30px; height: 30px; background-color: #fbf6ec; border: 1px solid #453f3c; border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.3); flex-shrink: 0;}
        .card-tag-display { font-size: 16px; font-family: 'Constantia', 'Georgia', serif; font-weight: bold; color: #2c2825; transform: translateY(0.5px);}
        
        .card-body { flex-grow: 1; position: relative; padding: 0 10px; overflow: hidden; display: flex; flex-direction: column; }
        
        .flesh-theme { background-color: #f7e6ea; } 
        .will-theme { background-color: #efe3fa; } 
        .method-theme { background-color: #e3f0fa; }
        
        .card-rich-text {
            width: 100%; height: 100%; background: transparent;
            font-family: 'Constantia', 'Cambria', 'Georgia', serif; font-size: 14px; font-weight: 400; color: #2c2825;
            padding: 0; overflow: hidden; white-space: pre-wrap; word-wrap: break-word;
            --lh: 24px; line-height: var(--lh);
            background-image: repeating-linear-gradient(transparent, transparent calc(var(--lh) - 1px), rgba(69, 63, 60, 0.15) calc(var(--lh) - 1px), rgba(69, 63, 60, 0.15) var(--lh));
            background-attachment: local;
        }
        .card-rich-text b, .card-rich-text strong { font-weight: 800; color: #000; }
        
        .card-footer { border-top: 1px dashed rgba(69, 63, 60, 0.25); padding: 3px 10px 5px 10px; display: flex; flex-direction: column; justify-content: center; height: 36px; background-color: rgba(255, 255, 255, 0.1); flex-shrink: 0;}
        .footer-label { font-size: 7px; font-weight: 800; color: #8a807a; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 1px; }
        .card-footer-tags-display { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: bold; color: #453f3c; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        /* Кнопки */
        .btn-edit { background-color: #c8b88f; color: #2b2b2b; border: none; padding: 7px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-edit:hover { background-color: #b9a878; }
        .card-link { color: #4a76a8; text-decoration: underline; text-decoration-style: dashed; font-weight: bold; }

        /* --- Карточки: библиотека слева, редактор справа --- */
        .cards-layout { width: 100%; max-width: 1360px; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 720px); gap: 20px; align-items: start; }
        .library, .editor { background: #38332f; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .library { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .library-toolbar { display: flex; gap: 8px; }
        .library-toolbar input { flex: 1; min-width: 0; }
        .library-toolbar select { max-width: 45%; }
        .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill-group button {
            background: #2b2b2b; border: 1px solid #635a55; color: #dcd3cb; border-radius: 16px;
            padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center;
        }
        .pill-group button.active { background: #c8b88f; border-color: #c8b88f; color: #2b2b2b; font-weight: bold; }
        .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
        .flesh-dot { background: #d4a3ae; } .will-dot { background: #bfa5df; } .method-dot { background: #a5c6df; }
        .library-count { font-size: 12px; color: #a89f97; }
        .library-list { display: flex; flex-direction: column; gap: 6px; }
        .lib-empty { color: #8a807a; text-align: center; }
        .lib-row { display: flex; background: #2b2b2b; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid transparent; }
        .lib-row:hover { border-color: #635a55; }
        .lib-row.active { border-color: #c8b88f; background: #3f3934; }
        .lib-stripe { width: 6px; flex-shrink: 0; background: #635a55; }
        .lib-stripe.flesh-theme { background: #d4a3ae; } .lib-stripe.will-theme { background: #bfa5df; } .lib-stripe.method-theme { background: #a5c6df; }
        .lib-main { padding: 8px 12px; min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .lib-title { font-family: 'Georgia', serif; font-weight: bold; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
        .lib-tag { font-family: 'Segoe UI', sans-serif; font-size: 11px; background: #fbf6ec; color: #2c2825; border-radius: 4px; padding: 0 5px; }
        .lib-meta { font-size: 11px; color: #a89f97; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-desc { font-size: 12px; color: #cfc6bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-owners { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .library-hint { font-size: 11px; color: #8a807a; margin-top: -6px; }
        .lib-row.pinned { outline: 1px dashed #a5c6df; }
        .lib-peek {
            align-self: flex-start; margin: 6px 6px 0 0; background: transparent; border: 1px solid #635a55; color: #dcd3cb;
            border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 13px; flex-shrink: 0;
        }
        .lib-peek:hover, .lib-row.pinned .lib-peek { background: #a5c6df; border-color: #a5c6df; color: #2b2b2b; }
        .compare { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed #635a55; }
        .compare-head { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .compare-head label { color: #a5c6df; }
        .compare-head button { background: transparent; border: none; color: #dcd3cb; font-size: 20px; cursor: pointer; line-height: 1; }
        .compare-owners { font-size: 11px; color: #a89f97; text-align: center; }
        .preview-col .card-link { cursor: pointer; }
        .owner-mini { font-size: 11px; background: #4a4440; border-radius: 4px; padding: 1px 6px; color: #dcd3cb; }
        .owner-mini.pool { background: #5a5236; color: #f0e2b0; }

        .editor { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
        .editor-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #4a443f; gap: 10px; }
        #editor-title { font-family: 'Georgia', serif; font-size: 18px; font-weight: bold; }
        #editor-title small { display: block; font-family: 'Segoe UI', sans-serif; font-weight: normal; font-size: 12px; color: #c8b88f; }
        .editor-body { display: flex; gap: 20px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
        .editor-form { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
        .preview-col { display: flex; flex-direction: column; align-items: center; gap: 8px; position: sticky; top: 0; width: calc(63.5mm + 4px); margin: 0 auto; }
        .form-row { display: flex; gap: 10px; }
        .form-row .grow { flex: 1; min-width: 0; }
        .form-row .small { width: 120px; }
        .desc-toolbar { display: flex; gap: 4px; flex-wrap: wrap; }
        .desc-toolbar button { background: #4a443f; color: #fbf6ec; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-family: 'Georgia', serif; font-size: 14px; }
        .desc-toolbar button:hover { background: #5c544e; }
        #input_description { min-height: 150px; }
        /* Тип и тэги на карточке заглавные — в полях тоже */
        #input_label, #input_footer { text-transform: uppercase; }
        .owner-pick { display: flex; flex-wrap: wrap; gap: 6px; }
        .owner-toggle { background: #2b2b2b; border: 1px solid #635a55; color: #dcd3cb; border-radius: 16px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
        .owner-toggle small { color: #8a807a; margin-left: 5px; }
        .owner-toggle.on { background: #c8b88f; border-color: #c8b88f; color: #2b2b2b; font-weight: bold; }
        .owner-toggle.on small { color: #5a5236; }
        .owner-toggle.adding { box-shadow: 0 0 0 2px #7fbf8e; }
        .owner-toggle.removing { border-color: #d46a66; color: #d46a66; text-decoration: line-through; }
        .owner-extra { display: flex; gap: 6px; }
        .owner-extra input { flex: 1; min-width: 0; padding: 6px 8px; font-size: 13px; }
        .owner-summary { font-size: 12px; color: #a89f97; min-height: 15px; }
        /* Кнопки всегда видны внизу редактора, даже если форма длиннее экрана */
        .editor-actions {
            display: flex; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; z-index: 2;
            background: #38332f; padding: 10px 0; margin-bottom: -10px; box-shadow: 0 -8px 12px -8px rgba(0,0,0,0.5);
        }
        .editor-actions .btn-submit { flex: 1; margin-top: 0; font-size: 14px; white-space: nowrap; }
        .btn-secondary { background: #4a443f; color: #fbf6ec; border: none; border-radius: 5px; padding: 10px 12px; font-weight: bold; cursor: pointer; }
        .btn-secondary:hover { background: #5c544e; }
        .btn-danger { background: transparent; color: #d4a3ae; border: 1px solid #d4a3ae; border-radius: 5px; padding: 10px 12px; font-weight: bold; cursor: pointer; }
        .btn-danger:hover { background: rgba(212, 163, 174, 0.12); }
        .status-msg { min-height: 18px; font-weight: bold; font-size: 13px; text-align: center; }
        .fit-warning { font-size: 12px; color: #e0b85a; text-align: center; min-height: 16px; }
        .hint { font-size: 11px; color: #8a807a; text-align: center; }

        /* Подсказки из существующих значений */
        .suggest {
            position: absolute; z-index: 3000; background: #2b2b2b; border: 1px solid #635a55; border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); max-height: 300px; overflow-y: auto; display: none;
        }
        .suggest.open { display: block; }
        .suggest-item { padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; font-size: 13px; }
        .suggest-item small { color: #8a807a; }
        .suggest-item.active, .suggest-item:hover { background: #4a443f; }
        .link-popover {
            position: absolute; z-index: 2900; background: #38332f; border: 1px solid #635a55; border-radius: 8px;
            padding: 10px; width: 290px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .link-popover.open { display: flex; flex-direction: column; gap: 6px; }
        .link-popover input { padding: 7px 9px; }
        .link-popover small { color: #a89f97; font-size: 11px; }

        @media (max-width: 1100px) {
            .cards-layout { grid-template-columns: 1fr; }
            .editor { order: -1; position: static; max-height: none; }
        }

        /* --- Вкладки пульта --- */
        .master-tabs { display: flex; gap: 8px; margin: -6px 0 24px; }
        .master-tab {
            background: #38332f; color: #dcd3cb; border: 1px solid #635a55; padding: 9px 18px;
            border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
        }
        .master-tab:hover { background: #4a443f; }
        .master-tab.active { background: #c8b88f; color: #2b2b2b; border-color: #c8b88f; }
        .master-view { display: none; width: 100%; flex-direction: column; align-items: center; }
        .master-view.active { display: flex; }

        /* --- Глаз бога: все персонажи --- */
        .players-toolbar { width: 100%; max-width: 1100px; display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .players-toolbar input { flex: 1; min-width: 200px; }
        .players-info { font-size: 13px; color: #dcd3cb; display: flex; gap: 16px; flex-wrap: wrap; }
        .players-grid { width: 100%; max-width: 1100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .players-empty { color: #8a807a; grid-column: 1 / -1; text-align: center; }
        .player-tile {
            background: #38332f; border-radius: 10px; padding: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 10px; border: 1px solid transparent;
        }
        /* Подсветка, когда в листе что-то поменялось */
        .player-tile.flash { animation: tile-flash 1.6s ease-out; }
        @keyframes tile-flash {
            from { border-color: #c8b88f; box-shadow: 0 0 0 3px rgba(200, 184, 143, 0.45); }
            to { border-color: transparent; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        }
        .player-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .player-name { font-family: 'Georgia', serif; font-size: 20px; font-weight: bold; color: #fbf6ec; overflow-wrap: anywhere; }
        .player-id { font-size: 11px; color: #a89f97; letter-spacing: 0.5px; font-weight: normal; font-family: 'Segoe UI', sans-serif; }
        .player-armor { background: #4a4440; padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; white-space: nowrap; }
        .meter-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #dcd3cb; margin-bottom: 4px; }
        .meter-top b { font-size: 14px; color: #fbf6ec; letter-spacing: 0; }
        .meter-bar { height: 6px; background: #4a4440; border-radius: 3px; overflow: hidden; }
        .meter-bar i { display: block; height: 100%; border-radius: 3px; transition: width 0.4s; }
        .player-stats { display: flex; gap: 6px; }
        .player-stats .stat {
            flex: 1; text-align: center; border-radius: 6px; padding: 5px 2px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.5px; color: #453f3c; font-weight: bold;
        }
        .player-stats .stat b { display: block; font-size: 17px; font-family: 'Georgia', serif; letter-spacing: 0; }
        .stat.flesh { background: #f7e6ea; } .stat.will { background: #efe3fa; } .stat.method { background: #e3f0fa; }
        .player-foot { font-size: 12px; color: #a89f97; }
        .player-actions { display: flex; gap: 6px; }
        .player-actions .btn-edit { flex: 1; }
        .btn-link { background: #635a55; color: #fbf6ec; border: none; border-radius: 4px; padding: 0 12px; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .btn-link:hover { background: #7a706a; }

        /* --- Лист игрока поверх пульта --- */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 2500; display: none; padding: 16px; }
        .sheet-overlay.active { display: flex; justify-content: center; }
        .sheet-panel {
            width: min(1120px, 100%); height: 100%; background: #2b2b2b; border-radius: 10px;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .sheet-panel-bar { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: #38332f; border-bottom: 1px solid #635a55; flex-wrap: wrap; }
        .sheet-panel-title { flex: 1; min-width: 0; font-family: 'Georgia', serif; font-size: 18px; font-weight: bold; }
        .sheet-mode { display: flex; background: #2b2b2b; border-radius: 6px; padding: 2px; }
        .sheet-mode button { background: transparent; border: none; color: #dcd3cb; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .sheet-mode button.active { background: #635a55; color: #fbf6ec; }
        .sheet-newtab { color: #a5c6df; font-size: 13px; text-decoration: none; }
        .sheet-newtab:hover { text-decoration: underline; }
        .sheet-close { background: transparent; border: none; color: #fbf6ec; font-size: 28px; cursor: pointer; line-height: 1; padding: 0 4px; }
        .sheet-frame-wrap { flex: 1; display: flex; justify-content: center; min-height: 0; }
        .sheet-frame-wrap iframe { border: none; width: 100%; height: 100%; background: #2b2b2b; }
        .sheet-frame-wrap.mobile iframe { width: 400px; max-width: 100%; border-left: 1px solid #635a55; border-right: 1px solid #635a55; }
    </style>
</head>
<body>

    <h1>Мастер-Пульт</h1>

    <div class="master-tabs">
        <button class="master-tab" data-view="players">👁 Глаз бога</button>
        <button class="master-tab" data-view="cards">🃏 Карточки</button>
    </div>

    <!-- Глаз бога: листы всех персонажей -->
    <div id="view-players" class="master-view">
        <div class="players-toolbar">
            <input type="search" id="players-search" placeholder="Поиск по имени или ID…">
            <div class="players-info">
                <span>Персонажей: <b id="players-count">0</b></span>
                <span id="players-status"></span>
            </div>
        </div>
        <div class="players-grid" id="players-grid"></div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay">
        <div class="sheet-panel">
            <div class="sheet-panel-bar">
                <div class="sheet-panel-title"><span id="sheet-panel-name"></span> <span class="player-id" id="sheet-panel-id"></span></div>
                <div class="sheet-mode">
                    <button type="button" data-mode="pc">ПК-лист</button>
                    <button type="button" data-mode="mobile">Телефон</button>
                </div>
                <a class="sheet-newtab" id="sheet-panel-newtab" target="_blank" rel="noopener">Открыть в новой вкладке ↗</a>
                <button type="button" class="sheet-close" onclick="closePlayerSheet()" title="Закрыть (Esc)">&times;</button>
            </div>
            <div class="sheet-frame-wrap" id="sheet-frame-wrap"><iframe id="sheet-frame" title="Лист персонажа"></iframe></div>
        </div>
    </div>

    <div id="view-cards" class="master-view">
        <div class="cards-layout">
            <!-- Библиотека: все карточки в игре и заготовки персонажа pool -->
            <section class="library">
                <div class="library-toolbar">
                    <input type="search" id="lib-search" placeholder="Поиск по названию, тексту, тэгам…">
                    <select id="lib-owner"><option value="">Все владельцы</option></select>
                </div>
                <div class="pill-group" id="lib-theme">
                    <button type="button" data-theme="" class="active">Все</button>
                    <button type="button" data-theme="flesh-theme"><i class="dot flesh-dot"></i>Плоть</button>
                    <button type="button" data-theme="will-theme"><i class="dot will-dot"></i>Воля</button>
                    <button type="button" data-theme="method-theme"><i class="dot method-dot"></i>Метод</button>
                </div>
                <div class="library-count" id="lib-count"></div>
                <div class="library-hint">Наведите на карточку — она появится рядом с редактором. 👁 — закрепить для сравнения, клик — редактировать.</div>
                <div class="library-list" id="library-list"></div>
            </section>

            <!-- Редактор карточки -->
            <section class="editor" id="editor">
                <div class="editor-head">
                    <div id="editor-title"></div>
                    <button type="button" class="btn-secondary" id="btn-new">＋ Новая</button>
                </div>
                <div class="editor-body">
                    <form class="editor-form" id="card-form" autocomplete="off">
                        <div class="form-group">
                            <label>Цвет</label>
                            <div class="pill-group" id="theme-pick">
                                <button type="button" data-theme="flesh-theme"><i class="dot flesh-dot"></i>Плоть</button>
                                <button type="button" data-theme="will-theme"><i class="dot will-dot"></i>Воля</button>
                                <button type="button" data-theme="method-theme"><i class="dot method-dot"></i>Метод</button>
                            </div>
                        </div>

    <!-- Выбор карточки для ссылки [[…]] -->

        <small>Выберите из списка или нажмите Enter, чтобы вставить как есть</small>
    </div>

    <script type="module">
        import { createClient } from './lib/supabase.js'

        const supabaseUrl = 'https://fzfijdsjgxoympldpwyq.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6ZmlqZHNqZ3hveW1wbGRwd3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNDY2NzAsImV4cCI6MjA5NDcyMjY3MH0.iAADzjFKSLEr1DHdQPq3j4Ji6tdh-NZhrTfIsvdxUgA'; 
        const supabase = createClient(supabaseUrl, supabaseKey);

        // Функция точного авто-ресайза текста описания
        window.resizeCardText = function(area) {
            if(!area) return;
            let currentFS = parseInt(area.getAttribute('data-max-size')) || 14;
            const lhRatio = 1.7; 

            const update = (fs) => {
                area.style.fontSize = fs + 'px';
                area.style.setProperty('--lh', (fs * lhRatio) + 'px');
            };

            update(currentFS);
            while (area.scrollHeight > area.parentElement.clientHeight && currentFS > 8) {
                currentFS -= 0.5;
                update(currentFS);
            }
        };

        // Функция авто-ресайза тэгов
        window.resizeTagsText = function(el) {
            if (!el) return;
            let currentFS = parseInt(el.getAttribute('data-max-size')) || 11;
            el.style.fontSize = currentFS + 'px';
            
            while (el.scrollWidth > el.clientWidth && currentFS > 6) {
                currentFS -= 0.5;
                el.style.fontSize = currentFS + 'px';
            }
        };

        // Экранирует одиночный "<", который не начинает тег (например «урон <5»). Теги вроде <b> работают как раньше
        function fixText(text) {
            return String(text == null ? '' : text).replace(/<(?![a-zA-Z\/!])/g, '&lt;');
        }

        window.parseCardLinks = function(text) {
            if (!text) return '';
            return fixText(text).replace(/\[\[(.*?)\]\]/g, (match, title) =>
                `<span class="card-link">${title}</span>`);
        }

        // Экранирование для безопасной вставки в HTML-атрибуты/текст
        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Поля содержимого карточки (всё, кроме id и owner_id)
        const CONTENT_FIELDS = ['theme', 'card_label', 'card_title', 'card_tag', 'card_description', 'card_footer_tags'];

        // Подпись карточки по содержимому — одинаковая подпись = «одна и та же карточка»
        function cardSignature(c) {
            return CONTENT_FIELDS.map(f => {
                let v = c[f] == null ? '' : String(c[f]);
                if (f === 'theme') v = v.trim();
                if (f === 'card_label') v = normLabel(v);
                if (f === 'card_footer_tags') v = normTags(v);
                return v;
            }).join('\u0001');
        }

        // Тип и тэги на карточке всегда показываются заглавными — так же их и храним,
        // чтобы «Оружие», «оружие» и «ОРУЖИЕ» считались одним значением
        function normLabel(v) {
            return String(v == null ? '' : v).trim().toUpperCase();
        }

        // Тэги записываются в квадратных скобках: [Оружие] [Ближний бой] — пробел внутри скобок
        // часть тэга. Текст вне скобок (старые карточки «Оружие, Контакт») разбираем по запятым
        function parseTags(v) {
            const tags = [];
            const rest = String(v == null ? '' : v).replace(/\[([^\]]*)\]/g, (m, t) => { tags.push(t); return ','; });
            rest.split(',').forEach(t => tags.push(t));
            return tags.map(t => t.replace(/[\[\]]/g, '').trim()).filter(Boolean);
        }

        function normTags(v) {
            const seen = new Set();
            return parseTags(v)
                .map(t => t.toUpperCase())
                .filter(t => !seen.has(t) && seen.add(t))
                .map(t => `[${t}]`)
                .join(' ');
        }

        // ===================== КАРТОЧКИ: библиотека и редактор =====================
        // Заготовки хранятся у «персонажа» pool: игроки их не видят, а карточка не пропадает,
        // даже если убрать её у всех игроков
        const POOL_ID = 'pool';
        const isPool = (id) => String(id).toLowerCase() === POOL_ID;
        const THEMES = ['flesh-theme', 'will-theme', 'method-theme'];

        let allCards = [];                // все строки таблицы cards
        let groups = [];                  // одинаковые карточки, сгруппированные по содержимому
        let editing = null;               // редактируемая группа { owners: [{ id, owner_id }] }; null — новая карточка
        let selectedOwners = new Set();   // кому выдать / у кого оставить (owner_id)
        let currentTheme = 'flesh-theme';
        let dirty = false;                // в редакторе есть несохранённые правки
        let pinnedSig = null;             // карточка, закреплённая для сравнения (по подписи содержимого)
        const libFilter = { q: '', theme: '', owner: '' };

        const $ = (id) => document.getElementById(id);

        // Текст описания без тегов — для поиска и строки в списке
        const plain = (html) => String(html || '')
            .replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\[\[(.*?)\]\]/g, '$1')
            .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
            .replace(/\s+/g, ' ').trim();

        function ownerName(id) {
            if (isPool(id)) return '📚 Библиотека';
            const p = players.find(x => String(x.id) === String(id));
            return (p && p.char_name) || String(id);
        }

        const byName = (a, b) => ownerName(a).localeCompare(ownerName(b), 'ru', { numeric: true });

        function setStatus(text, ok = true) {
            const el = $('status-msg');
            el.style.color = ok ? '#a5c6df' : '#d4a3ae';
            el.innerText = text;
        }

        function flashStatus(text) {
            setStatus(text);
            setTimeout(() => { if ($('status-msg').innerText === text) setStatus(''); }, 3000);
        }

        // --- Предпросмотр ---
        window.updatePreview = function() {
            $('prev_label').innerText = $('input_label').value || 'НАВЫК';
            $('prev_title').innerText = $('input_title').value || 'Без названия';
            $('prev_tag').innerText = $('input_tag').value;
            const descBox = $('prev_desc');
            descBox.innerHTML = window.parseCardLinks($('input_description').value);
            const footerEl = $('prev_footer');
            footerEl.innerText = normTags($('input_footer').value);
            $('prev_theme').className = `card-body ${currentTheme}`;
            window.resizeCardText(descBox);
            window.resizeTagsText(footerEl);
            updateFitWarning();
        };

        // Предупреждение, если текст не помещается в карточку
        function updateFitWarning() {
            const desc = $('prev_desc'), title = $('prev_title'), footer = $('prev_footer');
            if (!desc.parentElement.clientHeight) return; // вкладка скрыта — размеры не считаются
            const notes = [];
            const fs = parseFloat(desc.style.fontSize);
            if (desc.scrollHeight > desc.parentElement.clientHeight) notes.push('⚠ Описание не помещается даже мелким шрифтом — сократите текст');
            else if (fs < 14) notes.push(`Описание ужато до ${fs} px, чтобы поместиться`);
            if (title.scrollWidth > title.clientWidth) notes.push('⚠ Название не помещается и обрезается');
            if (footer.scrollWidth > footer.clientWidth) notes.push('⚠ Тэги не помещаются');
            const tag = $('prev_tag');
            if (tag.scrollWidth > tag.parentElement.clientWidth - 2) notes.push('⚠ Метка не помещается в квадрат');
            $('fit-warning').innerHTML = notes.map(esc).join('<br>');
        }

        function setTheme(theme) {
            currentTheme = THEMES.includes(theme) ? theme : 'flesh-theme';
            document.querySelectorAll('#theme-pick button').forEach(b => b.classList.toggle('active', b.dataset.theme === currentTheme));
            window.updatePreview();
        }

        function readFormContent() {
            return {
                theme: currentTheme,
                card_label: normLabel($('input_label').value),
                card_title: $('input_title').value,
                card_tag: $('input_tag').value,
                card_description: $('input_description').value,
                card_footer_tags: normTags($('input_footer').value)
            };
        }

        function fillForm(c) {
            $('input_label').value = c.card_label || '';
            $('input_title').value = c.card_title || '';
            $('input_tag').value = c.card_tag || '';
            $('input_description').value = c.card_description || '';
            $('input_footer').value = c.card_footer_tags || '';
            setTheme((c.theme || '').trim());
        }

        // --- Кому выдать ---
        function ownerCandidates() {
            const ids = new Set([POOL_ID]);
            players.forEach(p => { if (!isPool(p.id)) ids.add(String(p.id)); });
            allCards.forEach(c => { if (!isPool(c.owner_id)) ids.add(String(c.owner_id)); });
            selectedOwners.forEach(id => { if (!isPool(id)) ids.add(id); });
            const rest = [...ids].filter(id => !isPool(id)).sort(byName);
            return [POOL_ID, ...rest];
        }

        function renderOwnerPick() {
            const original = new Set(editing ? editing.owners.map(o => String(o.owner_id)) : []);
            // id библиотеки в базе может быть записан иначе (например, Pool) — сравниваем без регистра
            const has = (set, id) => isPool(id) ? [...set].some(isPool) : set.has(id);
            $('owner-pick').innerHTML = ownerCandidates().map(id => {
                const on = has(selectedOwners, id);
                const was = has(original, id);
                const state = editing ? (on && !was ? ' adding' : (!on && was ? ' removing' : '')) : '';
                const name = ownerName(id);
                const idHint = isPool(id) || name === id ? '' : `<small>${esc(id)}</small>`;
                return `<button type="button" class="owner-toggle${on ? ' on' : ''}${state}" data-owner="${esc(id)}">${esc(name)}${idHint}</button>`;
            }).join('');
            updateEditorButtons();
        }

        function toggleOwner(id) {
            const existing = [...selectedOwners].find(x => isPool(id) ? isPool(x) : x === id);
            if (existing !== undefined) selectedOwners.delete(existing);
            else selectedOwners.add(isPool(id) && editing ? (editing.owners.find(o => isPool(o.owner_id))?.owner_id ?? POOL_ID) : id);
            dirty = true;
            renderOwnerPick();
        }

        function updateEditorButtons() {
            const btn = $('submit-btn');
            const owners = [...selectedOwners];
            if (editing) {
                btn.textContent = 'Сохранить изменения';
                const original = editing.owners.map(o => String(o.owner_id));
                const add = owners.filter(id => !original.includes(id));
                const remove = original.filter(id => !selectedOwners.has(id));
                const parts = [];
                if (add.length) parts.push('выдать: ' + add.map(ownerName).join(', '));
                if (remove.length) parts.push('убрать у: ' + remove.map(ownerName).join(', '));
                $('owner-summary').textContent = parts.length
                    ? 'При сохранении — ' + parts.join('; ')
                    : `Правки применятся ко всем копиям (${original.length})`;
                $('btn-delete').textContent = `Удалить у всех (${editing.owners.length})`;
            } else {
                const onlyPool = owners.length === 1 && isPool(owners[0]);
                btn.textContent = !owners.length ? 'Выдать' : onlyPool ? 'Сохранить в библиотеку' : `Выдать (${owners.length})`;
                $('owner-summary').textContent = owners.length ? '' : 'Отметьте игроков или Библиотеку';
            }
            $('btn-duplicate').style.display = editing ? '' : 'none';
            $('btn-delete').style.display = editing ? '' : 'none';
            $('editor-title').innerHTML = editing
                ? 'Редактирование<small>Правки применятся ко всем копиям этой карточки</small>'
                : 'Новая карточка<small>Заполните поля и отметьте, кому выдать</small>';
        }

        // --- Переключение между карточками ---
        function confirmDiscard() {
            return !dirty || confirm('В редакторе есть несохранённые изменения. Отменить их?');
        }

        function startNew({ keepContent = false, owners = [] } = {}) {
            editing = null;
            if (!keepContent) fillForm({ theme: currentTheme, card_label: 'НАВЫК' });
            selectedOwners = new Set(owners.map(String));
            dirty = keepContent;
            renderOwnerPick();
            renderLibrary();
        }

        function editGroup(g) {
            editing = { owners: g.owners.map(o => ({ ...o })) };
            fillForm(g);
            selectedOwners = new Set(g.owners.map(o => String(o.owner_id)));
            dirty = false;
            setStatus('');
            renderOwnerPick();
            renderLibrary();
            if (window.innerWidth <= 1100) $('editor').scrollIntoView({ behavior: 'smooth' });
        }

        // --- Загрузка и библиотека ---
        async function fetchCards() {
            const { data: cards, error } = await supabase.from('cards').select('*').order('owner_id');
            if (error) {
                $('library-list').innerHTML = `<p class="lib-empty" style="color: #d4a3ae;">Ошибка загрузки базы: ${esc(error.message)}</p>`;
                return;
            }
            allCards = cards || [];
            cardCounts = new Map();
            allCards.forEach(c => cardCounts.set(String(c.owner_id), (cardCounts.get(String(c.owner_id)) || 0) + 1));

            // Группируем одинаковые карточки по содержимому
            const map = new Map();
            allCards.forEach(card => {
                const sig = cardSignature(card);
                if (!map.has(sig)) {
                    const group = { sig, owners: [] };
                    CONTENT_FIELDS.forEach(f => group[f] = card[f]);
                    map.set(sig, group);
                }
                map.get(sig).owners.push({ id: card.id, owner_id: card.owner_id });
            });
            groups = [...map.values()];
            groups.forEach(g => g.owners.sort((a, b) => isPool(a.owner_id) ? -1 : isPool(b.owner_id) ? 1 : byName(a.owner_id, b.owner_id)));

            // Редактируемая карточка могла измениться в базе — обновляем список её копий
            if (editing) {
                const ids = new Set(editing.owners.map(o => o.id));
                const g = groups.find(x => x.owners.some(o => ids.has(o.id)));
                if (g) editing.owners = g.owners.map(o => ({ ...o }));
                else if (!dirty) startNew();
            }
            renderPlayers();
        }

        function renderOwnerFilter() {
            const sel = $('lib-owner');
            const ids = [...new Set(allCards.map(c => String(c.owner_id)))]
                .sort((a, b) => isPool(a) ? -1 : isPool(b) ? 1 : byName(a, b));
            sel.innerHTML = '<option value="">Все владельцы</option>' +
                ids.map(id => `<option value="${esc(id)}">${esc(ownerName(id))}</option>`).join('');
            if (!ids.includes(libFilter.owner)) libFilter.owner = '';
            sel.value = libFilter.owner;
        }

        function renderLibrary() {
            const q = libFilter.q.trim().toLowerCase();
            const editingIds = new Set(editing ? editing.owners.map(o => o.id) : []);
            const list = groups.filter(g => {
                if (libFilter.theme && (g.theme || '').trim() !== libFilter.theme) return false;
                if (libFilter.owner && !g.owners.some(o => String(o.owner_id) === libFilter.owner)) return false;
                if (q) {
                    const hay = [g.card_title, g.card_label, g.card_tag, plain(g.card_description), g.card_footer_tags].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            }).sort((a, b) => String(a.card_title || '').localeCompare(String(b.card_title || ''), 'ru', { numeric: true }));

            $('lib-count').textContent = groups.length ? `Показано ${list.length} из ${groups.length}` : '';
            $('library-list').innerHTML = list.length ? list.map(g => {
                const theme = (g.theme || '').trim();
                const active = g.owners.some(o => editingIds.has(o.id)) ? ' active' : '';
                const owners = g.owners.map(o =>
                    `<span class="owner-mini${isPool(o.owner_id) ? ' pool' : ''}">${esc(ownerName(o.owner_id))}</span>`).join('');
                const meta = [g.card_label, g.card_footer_tags].filter(Boolean).map(esc).join(' · ');
                const desc = plain(g.card_description);
                const pinned = g.sig === pinnedSig ? ' pinned' : '';
                return `
                    <div class="lib-row${active}${pinned}" data-group="${groups.indexOf(g)}">
                        <div class="lib-stripe ${esc(theme)}"></div>
                        <div class="lib-main">
                            <div class="lib-title">${esc(g.card_title || 'Без названия')}${g.card_tag ? `<span class="lib-tag">${esc(g.card_tag)}</span>` : ''}</div>
                            ${meta ? `<div class="lib-meta">${meta}</div>` : ''}
                            ${desc ? `<div class="lib-desc">${esc(desc)}</div>` : ''}
                            <div class="lib-owners">${owners}</div>
                        </div>
                        <button type="button" class="lib-peek" data-action="peek" title="Закрепить рядом с редактором для сравнения">👁</button>
                    </div>`;
            }).join('') : `<p class="lib-empty">${groups.length ? 'Ничего не нашлось.' : 'Пока ни одной карточки.'}</p>`;
        }

        // Имена игроков могли поменяться — обновляем всё, где они показаны
        function refreshOwnerViews() {
            renderOwnerFilter();
            renderOwnerPick();
            renderLibrary();
            showCompare();
        }

        // --- Просмотр другой карточки рядом с редактором ---
        function cardHtml(g) {
            return `
                <div class="card">
                    <div class="card-frame">
                        <div class="card-header">
                            <div class="card-title-box">
                                <div class="card-label-display">${esc(g.card_label || 'НАВЫК')}</div>
                                <div class="card-title-display">${esc(g.card_title || 'Без названия')}</div>
                            </div>
                            <div class="card-tag-box"><div class="card-tag-display">${esc(g.card_tag || '')}</div></div>
                        </div>
                        <div class="card-body ${esc((g.theme || '').trim())}">
                            <div class="card-rich-text auto-resize-area" data-max-size="14">${window.parseCardLinks(g.card_description || '')}</div>
                        </div>
                        <div class="card-footer">
                            <div class="footer-label">ТЭГИ</div>
                            <div class="card-footer-tags-display auto-resize-tags" data-max-size="11">${esc(g.card_footer_tags || '')}</div>
                        </div>
                    </div>
                </div>`;
        }

        // Показывает карточку g (при наведении), а без аргумента — закреплённую, если она есть
        function showCompare(g) {
            const pinned = groups.find(x => x.sig === pinnedSig) || null;
            if (pinnedSig && !pinned) pinnedSig = null; // закреплённую удалили или изменили
            const shown = g || pinned;
            const box = $('compare');
            if (!shown) { box.style.display = 'none'; return; }
            box.style.display = '';
            $('compare-label').textContent = shown === pinned ? 'Для сравнения' : 'Просмотр';
            $('compare-close').style.visibility = shown === pinned ? '' : 'hidden';
            $('compare-card').innerHTML = cardHtml(shown);
            $('compare-owners').textContent = 'Есть у: ' + shown.owners.map(o => ownerName(o.owner_id)).join(', ');
            $('compare-card').querySelectorAll('.auto-resize-area').forEach(el => window.resizeCardText(el));
            $('compare-card').querySelectorAll('.auto-resize-tags').forEach(el => window.resizeTagsText(el));
        }

        function pinCompare(g) {
            pinnedSig = g && g.sig !== pinnedSig ? g.sig : null;
            renderLibrary();
            showCompare();
        }

        // --- Сохранение ---
        async function saveCard() {
            const content = readFormContent();
            if (!content.card_title.trim()) {
                setStatus('Укажите название способности.', false);
                $('input_title').focus();
                return;
            }
            const owners = [...selectedOwners];

            if (!editing) {
                if (!owners.length) { setStatus('Отметьте, кому выдать карточку (или Библиотеку).', false); return; }
                setStatus('Выдаём…');
                const { error } = await supabase.from('cards').insert(owners.map(owner_id => ({ owner_id, ...content })));
                if (error) { setStatus('Ошибка: ' + error.message, false); return; }
                const onlyPool = owners.length === 1 && isPool(owners[0]);
                flashStatus(onlyPool ? 'Сохранено в библиотеку.' : 'Выдано: ' + owners.map(ownerName).join(', ') + '.');
                // Готовимся к следующей карточке: цвет, тип и получатели остаются, текст очищаем
                ['input_title', 'input_tag', 'input_description', 'input_footer'].forEach(id => { $(id).value = ''; });
                dirty = false;
                window.updatePreview();
                fetchCards();
                return;
            }

            const original = editing.owners;
            const keep = original.filter(o => selectedOwners.has(String(o.owner_id)));
            const remove = original.filter(o => !selectedOwners.has(String(o.owner_id)));
            const add = owners.filter(id => !original.some(o => String(o.owner_id) === id));
            if (!keep.length && !add.length) {
                if (!confirm('Не отмечен ни один владелец — карточка будет удалена у всех и пропадёт совсем. Продолжить?')) return;
            } else if (remove.length && !confirm('Убрать карточку у: ' + remove.map(o => ownerName(o.owner_id)).join(', ') + '?')) {
                return;
            }

            setStatus('Сохранение…');
            const errors = [];
            let anchorId = keep.length ? keep[0].id : null;
            if (keep.length) {
                const { error } = await supabase.from('cards').update(content).in('id', keep.map(o => o.id));
                if (error) errors.push(error.message);
            }
            if (add.length) {
                const { data, error } = await supabase.from('cards').insert(add.map(owner_id => ({ owner_id, ...content }))).select('id');
                if (error) errors.push(error.message);
                else if (!anchorId && data && data.length) anchorId = data[0].id;
            }
            if (remove.length) {
                const { error } = await supabase.from('cards').delete().in('id', remove.map(o => o.id));
                if (error) errors.push(error.message);
            }
            if (errors.length) setStatus('Ошибка: ' + errors.join('; '), false);
            else flashStatus('Сохранено.');

            dirty = false;
            editing = anchorId ? { owners: [{ id: anchorId }] } : null;
            await fetchCards();
            const g = anchorId && groups.find(x => x.owners.some(o => o.id === anchorId));
            if (g) editGroup(g); else startNew();
        }

        async function deleteEditing() {
            if (!editing) return;
            const n = editing.owners.length;
            const inPool = editing.owners.some(o => isPool(o.owner_id));
            const msg = inPool
                ? `Удалить карточку у всех (${n}), включая Библиотеку? Она пропадёт совсем.`
                : `Удалить карточку у всех игроков (${n})? В Библиотеке её нет — она пропадёт совсем.`;
            if (!confirm(msg)) return;
            const { error } = await supabase.from('cards').delete().in('id', editing.owners.map(o => o.id));
            if (error) { setStatus('Ошибка: ' + error.message, false); return; }
            dirty = false;
            startNew();
            flashStatus('Карточка удалена.');
            fetchCards();
        }

        // --- Оформление описания: <b>, <i> и ссылки [[…]] ---
        function insertText(ta, text) {
            // execCommand сохраняет возможность отменить правку через Ctrl+Z
            if (!document.execCommand('insertText', false, text)) {
                ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
                ta.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        function wrapDescription(tag) {
            const ta = $('input_description');
            const open = `<${tag}>`, close = `</${tag}>`;
            const { selectionStart: s, selectionEnd: e, value: v } = ta;
            ta.focus();
            if (v.slice(s - open.length, s) === open && v.slice(e, e + close.length) === close) {
                // Уже оформлено — снимаем оформление
                ta.setSelectionRange(s - open.length, e + close.length);
                insertText(ta, v.slice(s, e));
                ta.setSelectionRange(s - open.length, e - open.length);
            } else {
                insertText(ta, open + v.slice(s, e) + close);
                ta.setSelectionRange(s + open.length, e + open.length);
            }
        }

        let linkRange = [0, 0];
        function openLinkPicker() {
            const ta = $('input_description');
            linkRange = [ta.selectionStart, ta.selectionEnd];
            const r = $('btn-link').getBoundingClientRect();
            const pop = $('link-popover');
            pop.style.left = (r.left + window.scrollX) + 'px';
            pop.style.top = (r.bottom + 6 + window.scrollY) + 'px';
            pop.classList.add('open');
            const input = $('link-search');
            input.value = ta.value.slice(linkRange[0], linkRange[1]);
            input.focus();
            input.select();
        }

        function closeLinkPicker() {
            $('link-popover').classList.remove('open');
        }

        function insertLink(title) {
            title = title.trim();
            closeLinkPicker();
            const ta = $('input_description');
            ta.focus();
            ta.setSelectionRange(linkRange[0], linkRange[1]);
            if (title) insertText(ta, `[[${title}]]`);
        }

        // --- Подсказки из уже существующих значений ---
        const suggestBox = document.createElement('div');
        suggestBox.className = 'suggest';
        document.body.appendChild(suggestBox);
        let suggestFor = null, suggestItems = [], suggestActive = -1;

        // Все значения поля из существующих карточек, самые частые — первыми.
        // Тэги разбираются по запятым, регистр не важен; тип и тэги показываем заглавными, как на карточке
        function suggestValues(field) {
            const upper = field === 'card_label' || field === 'card_footer_tags';
            const counts = new Map();
            for (const c of allCards) {
                const raw = c[field];
                if (!raw) continue;
                const parts = field === 'card_footer_tags' ? parseTags(raw) : [String(raw)];
                for (const part of parts) {
                    const v = upper ? part.trim().toUpperCase() : part.trim();
                    if (!v) continue;
                    const key = v.toLowerCase();
                    const entry = counts.get(key) || { v, n: 0 };
                    entry.n++;
                    counts.set(key, entry);
                }
            }
            return [...counts.values()].sort((a, b) => b.n - a.n || a.v.localeCompare(b.v, 'ru'));
        }

        function hideSuggest() {
            suggestBox.classList.remove('open');
            suggestFor = null;
        }

        function highlightSuggest() {
            suggestBox.querySelectorAll('.suggest-item').forEach((el, i) => el.classList.toggle('active', i === suggestActive));
            const active = suggestBox.querySelector('.suggest-item.active');
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function tagTokenStart(value) {
            return Math.max(value.lastIndexOf(']'), value.lastIndexOf(',')) + 1;
        }

        function pickSuggest(i) {
            const { input, multi, onPick } = suggestFor;
            const v = suggestItems[i].v;
            if (onPick) { hideSuggest(); onPick(v); return; }
            if (multi) {
                const before = input.value.slice(0, tagTokenStart(input.value)).trim();
                input.value = (before ? before + ' ' : '') + `[${v}] `;
            } else {
                input.value = v;
            }
            input.dispatchEvent(new Event('input', { bubbles: true })); // обновит превью; для тэгов — покажет следующие
            if (!multi) hideSuggest();
        }

        function attachSuggest(input, { field, multi = false, onPick = null }) {
            // При фокусе показываем все варианты, при наборе — только подходящие
            const show = (e) => {
                const value = input.value;
                const start = multi ? tagTokenStart(value) : 0;
                const typed = value.slice(start).replace(/^[\s\[]+/, '').trim().toLowerCase();
                const token = e && e.type === 'focus' && !multi ? '' : typed;
                const used = multi ? new Set(parseTags(value.slice(0, start)).map(x => x.toLowerCase())) : new Set();
                let items = suggestValues(field).filter(x => !used.has(x.v.toLowerCase()) && x.v.toLowerCase() !== typed);
                if (token) {
                    items = items.filter(x => x.v.toLowerCase().includes(token));
                    items.sort((a, b) => b.v.toLowerCase().startsWith(token) - a.v.toLowerCase().startsWith(token));
                }
                suggestFor = { input, multi, onPick };
                suggestItems = items;
                suggestActive = -1;
                if (!items.length) { suggestBox.classList.remove('open'); return; }
                suggestBox.innerHTML = items.map((x, i) =>
                    `<div class="suggest-item" data-i="${i}"><span>${esc(multi ? `[${x.v}]` : x.v)}</span><small>${x.n}</small></div>`).join('');
                const r = input.getBoundingClientRect();
                suggestBox.style.left = (r.left + window.scrollX) + 'px';
                suggestBox.style.top = (r.bottom + 2 + window.scrollY) + 'px';
                suggestBox.style.minWidth = r.width + 'px';
                suggestBox.classList.add('open');
            };
            input.setAttribute('autocomplete', 'off');
            input.addEventListener('focus', show);
            input.addEventListener('input', show);
            input.addEventListener('blur', () => setTimeout(() => {
                if (suggestFor && suggestFor.input === input && document.activeElement !== input) hideSuggest();
            }, 150));
            input.addEventListener('keydown', (e) => {
                if (!suggestBox.classList.contains('open') || !suggestFor || suggestFor.input !== input) return;
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const n = suggestItems.length;
                    suggestActive = e.key === 'ArrowDown' ? (suggestActive + 1) % n : (suggestActive - 1 + n) % n;
                    highlightSuggest();
                } else if ((e.key === 'Enter' || e.key === 'Tab') && suggestActive >= 0) {
                    e.preventDefault();
                    pickSuggest(suggestActive);
                } else if (e.key === 'Escape') {
                    hideSuggest();
                }
            });
        }

        suggestBox.addEventListener('mousedown', (e) => {
            e.preventDefault(); // не снимаем фокус с поля
            const item = e.target.closest('.suggest-item');
            if (item) pickSuggest(+item.dataset.i);
        });

        // --- События редактора и библиотеки ---
        const form = $('card-form');
        form.addEventListener('input', (e) => {
            if (e.target.id === 'owner-extra') return;
            dirty = true;
            window.updatePreview();
        });
        form.addEventListener('submit', (e) => { e.preventDefault(); saveCard(); });
        // Ctrl+Enter — выдать / сохранить, где бы ни был фокус на вкладке «Карточки»
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('view-cards').classList.contains('active')) {
                e.preventDefault();
                saveCard();
            }
        });
        form.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || e.ctrlKey || e.metaKey) return;
            if (e.target.tagName === 'INPUT' && !e.defaultPrevented) {
                // Enter в поле не выдаёт карточку случайно — для этого Ctrl+Enter
                e.preventDefault();
                if (e.target.id === 'owner-extra') $('owner-extra-add').click();
            }
        });

        $('input_description').addEventListener('keydown', (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            const key = e.key.toLowerCase();
            if (key === 'b' || key === 'и') { e.preventDefault(); wrapDescription('b'); }
            if (key === 'i' || key === 'ш') { e.preventDefault(); wrapDescription('i'); }
        });
        document.querySelectorAll('.desc-toolbar [data-wrap]').forEach(btn =>
            btn.addEventListener('click', () => wrapDescription(btn.dataset.wrap)));
        $('btn-link').addEventListener('click', openLinkPicker);
        $('link-search').addEventListener('keydown', (e) => {
            const suggestionChosen = suggestBox.classList.contains('open') && suggestActive >= 0;
            if (e.key === 'Enter' && !suggestionChosen) { e.preventDefault(); insertLink($('link-search').value); }
            if (e.key === 'Escape') { closeLinkPicker(); $('input_description').focus(); }
        });
        $('link-search').addEventListener('blur', () => setTimeout(() => {
            if (!$('link-popover').contains(document.activeElement)) closeLinkPicker();
        }, 150));

        document.querySelectorAll('#theme-pick button').forEach(b => b.addEventListener('click', () => {
            dirty = true;
            setTheme(b.dataset.theme);
        }));
        $('owner-pick').addEventListener('click', (e) => {
            const b = e.target.closest('[data-owner]');
            if (b) toggleOwner(b.dataset.owner);
        });
        $('owner-extra-add').addEventListener('click', () => {
            const id = $('owner-extra').value.trim();
            if (!id) return;
            if (![...selectedOwners].some(x => x === id || isPool(x) && isPool(id))) toggleOwner(id);
            $('owner-extra').value = '';
        });
        $('btn-new').addEventListener('click', () => { if (confirmDiscard()) { startNew(); setStatus(''); $('input_title').focus(); } });
        $('btn-duplicate').addEventListener('click', () => {
            startNew({ keepContent: true });
            setStatus('Это копия: измените её и выдайте как новую карточку.');
        });
        $('btn-delete').addEventListener('click', deleteEditing);

        $('library-list').addEventListener('click', (e) => {
            const row = e.target.closest('.lib-row');
            if (!row) return;
            const g = groups[+row.dataset.group];
            if (!g) return;
            if (e.target.closest('[data-action="peek"]')) pinCompare(g);
            else if (confirmDiscard()) editGroup(g);
        });
        // Наведение на карточку в библиотеке показывает её целиком рядом с редактором
        let hoverTimer = null;
        $('library-list').addEventListener('mouseover', (e) => {
            const row = e.target.closest('.lib-row');
            if (!row) return;
            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(() => showCompare(groups[+row.dataset.group]), 120);
        });
        $('library-list').addEventListener('mouseleave', () => {
            clearTimeout(hoverTimer);
            showCompare();
        });
        $('compare-close').addEventListener('click', () => pinCompare(null));
        // Клик по ссылке [[…]] в превью открывает ту карточку для сравнения
        document.querySelector('.preview-col').addEventListener('click', (e) => {
            const link = e.target.closest('.card-link');
            if (!link) return;
            const title = link.textContent.trim().toLowerCase();
            const g = groups.find(x => String(x.card_title || '').trim().toLowerCase() === title);
            if (g) { pinnedSig = null; pinCompare(g); }
            else setStatus(`Карточка «${link.textContent}» не найдена.`, false);
        });
        $('lib-search').addEventListener('input', (e) => { libFilter.q = e.target.value; renderLibrary(); });
        $('lib-owner').addEventListener('change', (e) => { libFilter.owner = e.target.value; renderLibrary(); });
        document.querySelectorAll('#lib-theme button').forEach(b => b.addEventListener('click', () => {
            libFilter.theme = b.dataset.theme;
            document.querySelectorAll('#lib-theme button').forEach(x => x.classList.toggle('active', x === b));
            renderLibrary();
        }));

        attachSuggest($('input_label'), { field: 'card_label' });
        attachSuggest($('input_tag'), { field: 'card_tag' });
        attachSuggest($('input_title'), { field: 'card_title' });
        attachSuggest($('input_footer'), { field: 'card_footer_tags', multi: true });
        attachSuggest($('link-search'), { field: 'card_title', onPick: insertLink });

        window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

        // ===================== ГЛАЗ БОГА: листы всех персонажей =====================
        const POLL_MS = 5000;
        let players = [];               // строки таблицы characters
        let cardCounts = new Map();     // owner_id → сколько у игрока карточек
        let playersRealtimeOk = false;
        let playersPollTimer = null;
        let playersLastOk = null;
        let openedPlayerId = null;
        let sheetMode = window.innerWidth < 900 ? 'mobile' : 'pc';

        const val = (v) => (v == null || v === '') ? '—' : esc(v);
        const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : null; };

        function sheetUrl(id, mode) {
            const page = mode === 'mobile' ? 'mobile.html' : 'index.html';
            return new URL(`${page}?id=${encodeURIComponent(id)}`, location.href).href;
        }

        function meter(label, cur, max, color) {
            const c = num(cur), m = num(max);
            const pct = c !== null && m ? Math.max(0, Math.min(100, c / m * 100)) : null;
            return `
                <div>
                    <div class="meter-top"><span>${label}</span><b>${val(cur)} / ${val(max)}</b></div>
                    <div class="meter-bar">${pct === null ? '' : `<i style="width: ${pct}%; background: ${color};"></i>`}</div>
                </div>`;
        }

        function playerTile(p) {
            const id = String(p.id);
            return `
                <div class="player-tile" data-id="${esc(id)}">
                    <div class="player-head">
                        <div>
                            <div class="player-name">${p.char_name ? esc(p.char_name) : 'Без имени'}</div>
                            <div class="player-id">ID: ${esc(id)}</div>
                        </div>
                        <div class="player-armor" title="Броня">🛡 ${val(p.armor)}</div>
                    </div>
                    ${meter('ХП', p.hp_current, p.hp_max, '#c97b84')}
                    ${meter('Очки воли', p.willpower_current, p.willpower_max, '#9a86c4')}
                    <div class="player-stats">
                        <span class="stat flesh">Плоть<b>${val(p.stat_flesh)}</b></span>
                        <span class="stat will">Воля<b>${val(p.stat_will)}</b></span>
                        <span class="stat method">Метод<b>${val(p.stat_method)}</b></span>
                    </div>
                    <div class="player-foot">Карточек: ${cardCounts.get(id) || 0}</div>
                    <button class="btn-edit" data-action="open">👁 Открыть лист</button>
                    <div class="player-actions">
                        <button class="btn-link" data-action="give" title="Открыть конструктор карточек с этим игроком">🃏 Выдать карточку</button>
                        <button class="btn-link" data-action="copy" title="Скопировать ссылку на лист для игрока">🔗 Ссылка</button>
                    </div>
                </div>`;
        }

        function renderPlayers() {
            const grid = document.getElementById('players-grid');
            const q = document.getElementById('players-search').value.trim().toLowerCase();
            const list = players
                .filter(p => !isPool(p.id))
                .filter(p => !q || String(p.char_name || '').toLowerCase().includes(q) || String(p.id).toLowerCase().includes(q))
                .sort((a, b) => String(a.char_name || a.id).localeCompare(String(b.char_name || b.id), 'ru', { numeric: true }));
            grid.innerHTML = list.length
                ? list.map(playerTile).join('')
                : `<p class="players-empty">${players.some(p => !isPool(p.id)) ? 'Никого не нашлось.' : 'Пока нет ни одного персонажа.'}</p>`;
            document.getElementById('players-count').textContent = players.filter(p => !isPool(p.id)).length;
            updateOpenedTitle();
            refreshOwnerViews();
        }

        function flashTiles(ids) {
            ids.forEach(id => {
                const tile = document.querySelector(`.player-tile[data-id="${CSS.escape(String(id))}"]`);
                if (!tile) return;
                tile.classList.remove('flash');
                void tile.offsetWidth; // перезапуск анимации
                tile.classList.add('flash');
            });
        }

        function updatePlayersStatus() {
            let color, label;
            if (playersLastOk === false) { color = '#d46a66'; label = 'Нет связи с базой'; }
            else if (playersRealtimeOk) { color = '#7fbf8e'; label = 'Изменения видны мгновенно'; }
            else if (playersPollTimer) { color = '#e0b85a'; label = 'Обновление раз в 5 секунд'; }
            else { color = '#e0b85a'; label = 'Подключение…'; }
            document.getElementById('players-status').innerHTML = `<span style="color: ${color};">●</span> ${label}`;
        }

        // Загрузка всех персонажей. При повторной загрузке подсвечиваем тех, у кого что-то поменялось
        let loadingPlayers = false;
        async function loadPlayers() {
            if (loadingPlayers) return;
            loadingPlayers = true;
            const { data, error } = await supabase.from('characters').select('*');
            loadingPlayers = false;
            playersLastOk = !error;
            if (!error) {
                const before = new Map(players.map(p => [String(p.id), JSON.stringify(p)]));
                const firstLoad = players.length === 0;
                players = data || [];
                renderPlayers();
                if (!firstLoad) flashTiles(players.filter(p => before.get(String(p.id)) !== JSON.stringify(p)).map(p => p.id));
            }
            updatePlayersStatus();
        }

        function startPlayersPolling() {
            if (!playersPollTimer) playersPollTimer = setInterval(loadPlayers, POLL_MS);
        }

        supabase
            .channel('master-characters')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'characters' }, (payload) => {
                if (payload.eventType === 'DELETE') {
                    players = players.filter(p => String(p.id) !== String(payload.old.id));
                    renderPlayers();
                    return;
                }
                const row = payload.new;
                const i = players.findIndex(p => String(p.id) === String(row.id));
                if (i >= 0) players[i] = row; else players.push(row);
                renderPlayers();
                flashTiles([row.id]);
            })
            .subscribe((status) => {
                playersRealtimeOk = status === 'SUBSCRIBED';
                if (playersRealtimeOk) {
                    clearInterval(playersPollTimer);
                    playersPollTimer = null;
                    loadPlayers(); // подтягиваем то, что могли пропустить без соединения
                } else {
                    startPlayersPolling();
                }
                updatePlayersStatus();
            });
        // Подстраховка: если realtime молчит дольше 10 секунд, включаем опрос
        setTimeout(() => { if (!playersRealtimeOk) { startPlayersPolling(); updatePlayersStatus(); } }, 10000);

        document.getElementById('players-search').addEventListener('input', renderPlayers);

        document.getElementById('players-grid').addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const id = btn.closest('.player-tile').dataset.id;
            if (btn.dataset.action === 'open') {
                openPlayerSheet(id);
            } else if (btn.dataset.action === 'give') {
                // Новая карточка — просто отмечаем игрока; если редактировали другую — начинаем новую
                if (editing) {
                    if (!confirmDiscard()) return;
                    startNew({ owners: [id] });
                } else {
                    selectedOwners = new Set([id]);
                    renderOwnerPick();
                }
                showView('cards');
                $('input_title').focus();
            } else if (btn.dataset.action === 'copy') {
                const url = sheetUrl(id, 'pc');
                try {
                    await navigator.clipboard.writeText(url);
                    btn.textContent = '✓ Скопировано';
                    setTimeout(() => { btn.textContent = '🔗 Ссылка'; }, 1500);
                } catch {
                    window.prompt('Ссылка на лист игрока:', url);
                }
            }
        });

        // --- Лист игрока поверх пульта: тот же лист, что у игрока, правки сохраняются сразу ---
        const overlay = document.getElementById('sheet-overlay');
        const frame = document.getElementById('sheet-frame');
        let unloadTimer = null;

        function updateOpenedTitle() {
            if (!openedPlayerId) return;
            const p = players.find(x => String(x.id) === openedPlayerId);
            document.getElementById('sheet-panel-name').textContent = (p && p.char_name) || 'Без имени';
            document.getElementById('sheet-panel-id').textContent = 'ID: ' + openedPlayerId;
        }

        function showSheetMode() {
            document.querySelectorAll('.sheet-mode button').forEach(b => b.classList.toggle('active', b.dataset.mode === sheetMode));
            document.getElementById('sheet-frame-wrap').classList.toggle('mobile', sheetMode === 'mobile');
            const url = sheetUrl(openedPlayerId, sheetMode);
            document.getElementById('sheet-panel-newtab').href = url;
            frame.src = url;
        }

        window.openPlayerSheet = function(id) {
            clearTimeout(unloadTimer);
            openedPlayerId = String(id);
            updateOpenedTitle();
            showSheetMode();
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closePlayerSheet = function() {
            if (!overlay.classList.contains('active')) return;
            // Снимаем фокус с поля в листе — так последняя правка точно уйдёт в базу
            try { frame.contentDocument.activeElement.blur(); } catch {}
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            openedPlayerId = null;
            // Выгружаем лист чуть позже, чтобы сохранение успело завершиться
            unloadTimer = setTimeout(() => { frame.src = 'about:blank'; }, 4000);
        };

        document.querySelectorAll('.sheet-mode button').forEach(b => b.addEventListener('click', () => {
            sheetMode = b.dataset.mode;
            try { frame.contentDocument.activeElement.blur(); } catch {}
            setTimeout(showSheetMode, 300);
        }));

        // Внутри пульта режим листа переключается кнопками на панели — свою кнопку листа прячем
        frame.addEventListener('load', () => {
            try {
                const style = frame.contentDocument.createElement('style');
                style.textContent = '.switch-version-btn, .switch-desktop-btn { display: none !important; }';
                frame.contentDocument.head.appendChild(style);
            } catch {}
        });

        overlay.addEventListener('click', (e) => { if (e.target === overlay) closePlayerSheet(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayerSheet(); });

        // --- Вкладки пульта ---
        function showView(name) {
            document.querySelectorAll('.master-tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
            document.querySelectorAll('.master-view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
            try { localStorage.setItem('master-view', name); } catch {}
            // Пока вкладка была скрыта, размер текста в превью не считался — пересчитываем
            if (name === 'cards') window.updatePreview();
        }
        document.querySelectorAll('.master-tab').forEach(t => t.addEventListener('click', () => showView(t.dataset.view)));
        let savedView = null;
        try { savedView = localStorage.getItem('master-view'); } catch {}
        showView(savedView === 'cards' ? 'cards' : 'players');

        // Инициализация
        startNew();
        updatePlayersStatus();
        loadPlayers();
        fetchCards();
    </script>
</body>
</html>
